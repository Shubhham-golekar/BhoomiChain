name: BhoomiChain CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: {}

jobs:
  # ── Job 1: Compile Compact smart contract ───────────────────────────────
  compile-contract:
    name: Compile bhoomi.compact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contract/package-lock.json

      - name: Install contract dependencies
        working-directory: contract
        run: npm ci

      - name: Compile Compact contract (bhoomi.compact)
        working-directory: contract
        run: npm run compact

      - name: Run contract lint & typecheck
        working-directory: contract
        run: npm run ci

  # ── Job 2: Frontend lint & typecheck ────────────────────────────────────
  frontend-check:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Typecheck frontend (TypeScript)
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend (ESLint)
        working-directory: frontend
        run: npm run lint

  # ── Job 3: Build frontend for production ────────────────────────────────
  build-frontend:
    name: Production Build
    runs-on: ubuntu-latest
    needs: frontend-check
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production
